# Kukátko na VPS: databáza + web + robot + HTTPS (Caddy).
# Spustenie: docker compose up -d --build
name: kukatko

x-db-url: &dburl postgres://${POSTGRES_USER:-kukatko}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kukatko}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kukatko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastav POSTGRES_PASSWORD v .env}
      POSTGRES_DB: ${POSTGRES_DB:-kukatko}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Databáza je dostupná len zo samotného VPS, nie z internetu.
    # Z vlastného PC sa pripojíš cez SSH tunel: ssh -L 5432:127.0.0.1:5432 user@vps
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: { context: ./app, target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *dburl
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: { context: ./app, target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *dburl
      DB_POOL: "4"
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Nastav DOMAIN v .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
