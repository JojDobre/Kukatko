<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bez pripojenia | Kukátko</title>
<style>
:root{--bg:#EEEEF2;--tile:#fff;--fg:#15151C;--muted:#6B6B7A;--accent:#FF5A1F}
@media (prefers-color-scheme:dark){:root{--bg:#0C0C10;--tile:#17171D;--fg:#F2F2F6;--muted:#8E8E9E;--accent:#FF6B33}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:16px}
div{background:var(--tile);border-radius:26px;padding:28px;max-width:420px;text-align:center}
h1{margin:0 0 8px;font-size:22px}p{margin:0 0 18px;color:var(--muted)}
button{border:0;border-radius:999px;padding:12px 20px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
</style></head>
<body><div><h1>Si offline</h1><p>Na zobrazenie seriálov potrebuješ internet. Skontroluj pripojenie a skús to znova.</p><button onclick="location.reload()">Skúsiť znova</button></div></body></html>
